<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f3a"/>
      <stop offset="1" stop-color="#3b2f5c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6cdf"/>
      <stop offset="1" stop-color="#8a3fd1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f5c"/>
      <stop offset="1" stop-color="#22252d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#room)"/>
  <!-- the floor and the TV stand -->
  <rect y="470" width="800" height="64" fill="#2a2140"/>
  <rect x="300" y="430" width="440" height="40" rx="6" fill="#5b4a7a"/>
  <!-- the TV -->
  <g transform="translate(330 215)">
    <rect x="0" y="0" width="380" height="200" rx="8" fill="#0e0f14"/>
    <rect x="10" y="10" width="360" height="180" rx="4" fill="url(#screen)"/>
    <circle cx="120" cy="100" r="34" fill="#ffffff" opacity="0.18"/>
    <polygon points="110,84 110,116 138,100" fill="#ffffff" opacity="0.85"/>
    <rect x="170" y="80" width="150" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="170" y="100" width="110" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- the soundbar -->
  <g transform="translate(345 395)">
    <rect x="0" y="0" width="350" height="34" rx="17" fill="url(#bar)"/>
    <g fill="#14161c">
      <circle cx="40" cy="17" r="2.5"/><circle cx="52" cy="17" r="2.5"/><circle cx="64" cy="17" r="2.5"/>
      <circle cx="286" cy="17" r="2.5"/><circle cx="298" cy="17" r="2.5"/><circle cx="310" cy="17" r="2.5"/>
    </g>
    <rect x="160" y="13" width="30" height="8" rx="4" fill="#5ee0a0"/>
  </g>
  <!-- the subwoofer -->
  <g transform="translate(220 360)">
    <rect x="0" y="0" width="70" height="110" rx="8" fill="url(#bar)"/>
    <circle cx="35" cy="62" r="24" fill="#14161c"/>
    <circle cx="35" cy="62" r="10" fill="#2f333d"/>
  </g>
  <!-- the sound -->
  <g fill="none" stroke="#ffc861" stroke-width="5" stroke-linecap="round">
    <path d="M330 382 q-22 30 0 60" opacity="0.9"/>
    <path d="M314 372 q-34 40 0 80" opacity="0.6"/>
    <path d="M710 382 q22 30 0 60" opacity="0.9"/>
    <path d="M726 372 q34 40 0 80" opacity="0.6"/>
  </g>
  <g fill="#ffc861">
    <circle cx="170" cy="300" r="7"/>
    <rect x="175" y="262" width="4" height="40"/>
    <path d="M179 262 q16 6 14 22 q-4 -10 -14 -10 z"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff">
    <text x="40" y="92" font-size="64" font-weight="bold">LG Soundbar</text>
    <text x="42" y="140" font-size="28">for Gladys Assistant</text>
    <text x="42" y="180" font-size="20" fill="#d9d2f2">power · volume · input · sound mode · scenes</text>
    <text x="42" y="210" font-size="16" fill="#b9b0d8">local network only · not affiliated with LG</text>
  </g>
</svg>
